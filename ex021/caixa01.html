<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1{ /* box-level*/
            background-color: bisque;
            height: 300px;
            width: 300px;
            /* 
            shorthand, junta 3 linhas em uma:
            border-width: 10px;
            border-style: solid;
            border-color: rgb(19, 87, 87);
            */
            border: 10px solid darkslategray;

            /* 
            shorthand, se todos forem iguais, só coloca um valor, se colocar dois valores, é aplicado o primeiro no topo e embaixo e o segundo valor, dos dois lados:

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            */
            padding: 10px;

            /* 
            shorthand pode juntar os 4 em uma linha, se for centralizar pode utilizar auto:
            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;
            */
            margin: 20px 20px 40px 20px;

            /* 
            shorthand, junta as 3 em uma linha:
            outline-width: 5px;
            outline-style: dashed;
            outline-color: aqua;
            */
            outline: 5px dashed aqua;
        }
        a{ /* inline-level*/
            border-width: 10px;
            border-style: solid;
            border-color: rgb(216, 51, 51);
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafo também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
