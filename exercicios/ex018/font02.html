<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family:'love';
            src: url('fonts/love story ttf') format(-truetype);
           
            /*
            Tipos de format()
            -opentype (otf)
            -truetype (ttf)
            -embedded-opentype
            -truetype-att (Apple Advanced Typography)
            -svg
            */
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family:'love';
            font-size: 3em;
            
            
        }
    </style>
</head>
<body>
    <h1>(Título)</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Cumque, suscipit laborum dolor sapiente quibusdam, omnis natus doloremque iusto eum accusamus exercitationem eius! Corrupti voluptatum sequi quo velit ratione magnam error.</p>
</body>
</html>
